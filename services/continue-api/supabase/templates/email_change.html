<!--
  Confirmation code for attaching an email to an existing (anonymous) account,
  which is what makes a backup recoverable after a reinstall.
-->
<h2>Confirm your email for Continue?</h2>

<p>Enter this code in the app to attach this address to your death tally:</p>

<p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">
  {{ .Token }}
</p>

<p>
  Once confirmed, you can restore your games and death counts on a new phone.
  It expires in an hour. If you didn't ask for this, you can ignore this email.
</p>
