<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Continue? app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17171d"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.55">
      <stop stop-color="#ff5a36" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tally" x1="256" y1="120" x2="256" y2="392" gradientUnits="userSpaceOnUse">
